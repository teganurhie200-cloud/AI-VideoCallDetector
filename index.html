<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Advanced Video Call with Face Detection</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Styles -->
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 10px;
            background: #111;
            color: white;
            text-align: center;
        }

        h3 {
            margin: 5px 0;
        }

        .container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }

        input {
            padding: 10px;
            width: 90%;
            max-width: 250px;
            font-size: 16px;
        }

        button {
            padding: 10px 15px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            background: green;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: darkgreen;
        }

        .videos {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }

        .video-wrapper {
            position: relative;
            display: inline-block;
        }

        video {
            width: 100%;
            max-width: 400px;
            border-radius: 10px;
            background: black;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
        }

        @media (min-width: 768px) {
            video { width: 45%; }
        }
    </style>
</head>
<body>

<h3>My ID: <span id="my-id">...</span></h3>

<div class="container">
    <div class="controls">
        <input type="text" id="friend-id" placeholder="Enter friend's ID">
        <button id="call-btn" onclick="callFriend()" disabled>📞 Call</button>
    </div>

    <div class="controls">
        <button onclick="toggleMute()">🔇 Mute</button>
        <button onclick="toggleVideo()">🎥 Camera Off</button>
        <button onclick="switchCamera()">🔄 Switch Camera</button>
    </div>

    <div class="videos">
        <div class="video-wrapper">
            <h3>My Video</h3>
            <video id="my-video" autoplay playsinline></video>
            <canvas id="overlay"></canvas>
        </div>
        <div class="video-wrapper">
            <h3>Friend Video</h3>
            <video id="friend-video" autoplay playsinline></video>
        </div>
    </div>

    
</div>

<!-- Libraries -->
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/face-api.js"></script>

<script>
let peer = new Peer();
let myStream, currentStream;
let videoTrack, audioTrack;
let usingFrontCamera = true;

// Start camera
async function startCamera() {
    const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: usingFrontCamera ? "user" : "environment" },
        audio: true
    });

    currentStream = stream;
    myStream = stream;

    videoTrack = stream.getVideoTracks()[0];
    audioTrack = stream.getAudioTracks()[0];

    document.getElementById('my-video').srcObject = stream;

    document.getElementById('call-btn').disabled = false;

    startFaceDetection();
}

// Prevent mobile tap from pausing video
const videos = document.querySelectorAll('video');
videos.forEach(v => {
    v.addEventListener('touchstart', e => e.preventDefault(), { passive: false });
    v.addEventListener('click', e => e.preventDefault());
});

// Initialize
startCamera();

// Show my Peer ID
peer.on('open', id => {
    document.getElementById('my-id').innerText = id;
});

// Answer incoming call
peer.on('call', call => {
    call.answer(myStream);
    call.on('stream', friendStream => {
        document.getElementById('friend-video').srcObject = friendStream;
    });
});

// Call a friend
function callFriend() {
    const friendId = document.getElementById('friend-id').value.trim();
    if (!friendId) return alert("Enter friend's ID");

    const call = peer.call(friendId, myStream);

    call.on('stream', friendStream => {
        document.getElementById('friend-video').srcObject = friendStream;
    });

    call.on('error', err => console.log(err));
}

// Mute / unmute
function toggleMute() {
    audioTrack.enabled = !audioTrack.enabled;
    alert(audioTrack.enabled ? "Unmuted" : "Muted");
}

// Camera on/off
function toggleVideo() {
    videoTrack.enabled = !videoTrack.enabled;
    alert(videoTrack.enabled ? "Camera On" : "Camera Off");
}

// Switch camera
async function switchCamera() {
    usingFrontCamera = !usingFrontCamera;

    const newStream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: usingFrontCamera ? "user" : "environment" },
        audio: true
    });

    document.getElementById('my-video').srcObject = newStream;

    videoTrack = newStream.getVideoTracks()[0];
    audioTrack = newStream.getAudioTracks()[0];

    // Replace tracks in ongoing calls
    const connections = peer.connections;
    Object.values(connections).forEach(arr => {
        arr.forEach(conn => {
            const sender = conn.peerConnection.getSenders();
            sender.forEach(s => {
                if (s.track.kind === "video") s.replaceTrack(videoTrack);
                if (s.track.kind === "audio") s.replaceTrack(audioTrack);
            });
        });
    });

    myStream = newStream;
}

// Face Detection
async function startFaceDetection() {
    await faceapi.nets.tinyFaceDetector.loadFromUri('https://cdn.jsdelivr.net/npm/face-api.js/weights');
    const video = document.getElementById('my-video');
    const canvas = document.getElementById('overlay');
    const displaySize = { width: video.width, height: video.height };
    faceapi.matchDimensions(canvas, displaySize);

    video.addEventListener('play', () => {
        setInterval(async () => {
            const detections = await faceapi.detectAllFaces(video, new faceapi.TinyFaceDetectorOptions());
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const resized = faceapi.resizeResults(detections, displaySize);
            faceapi.draw.drawDetections(canvas, resized);
        }, 100);
    });
}
</script>
</body>
</html>
